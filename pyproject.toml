[project]
name = "aem"
version = "0.2.0"
description = "Australia Environmental Monitoring — Scientific Extension"
requires-python = ">=3.10"
authors = [
    { name = "Ghulam Abbas Zafari", email = "ghulamabbas.zafari@gmail.com" }
]

dependencies = [
    "earthengine-api>=1.5.0",
    "geemap>=0.35.0",
    "rasterio>=1.3.0",
    "rioxarray>=0.15.0",
    "xarray>=2024.1.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "pymannkendall>=1.4.3",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "loguru>=0.7.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
