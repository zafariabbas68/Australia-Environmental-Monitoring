<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a111f" />
<title>Trends — Australia Environmental Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="../styles.css" />
<style>
  #trend-map { position: absolute; top: 64px; left: 0; right: 0; bottom: 0; z-index: 1; }
  .trend-title {
    position: absolute; top: 76px; left: 50%; transform: translateX(-50%);
    z-index: 1100; text-align: center; padding: 10px 24px;
    background: rgba(10, 17, 31, 0.85); backdrop-filter: blur(10px);
    border: 1px solid rgba(34, 211, 238, 0.25); border-radius: 14px;
    pointer-events: none; max-width: 90%;
  }
  .trend-title h2 {
    margin: 0; font-family: var(--font-display);
    font-size: clamp(15px, 2.2vw, 22px); font-weight: 700;
    background: linear-gradient(135deg, #fff 0%, #67e8f9 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .trend-title p { margin: 3px 0 0; font-size: 11.5px; color: var(--text-dim); }
  .variable-toggle {
    position: absolute; top: 130px; right: 16px; z-index: 1100;
    background: rgba(19, 28, 46, 0.96); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 6px; display: flex; gap: 4px;
  }
  .variable-toggle button {
    background: transparent; color: var(--text-dim); border: none;
    padding: 8px 16px; border-radius: 8px; font-size: 12.5px;
    font-weight: 500; cursor: pointer; transition: all 0.15s;
    font-family: var(--font-body);
  }
  .variable-toggle button.active { background: #7c3aed; color: #fff; font-weight: 600; }
  .variable-toggle button:not(.active):hover { background: rgba(124, 58, 237, 0.15); color: #c4b5fd; }
  .stats-panel {
    position: absolute; top: 200px; left: 16px; z-index: 1100;
    background: rgba(19, 28, 46, 0.96); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 20px; min-width: 260px; box-shadow: var(--shadow);
  }
  .stats-panel h3 {
    margin: 0 0 12px; font-family: var(--font-display);
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--muted);
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; font-size: 13px; }
  .stat-row .label { color: var(--text-dim); }
  .stat-row .value { font-family: var(--font-mono); font-weight: 600; color: var(--accent-hi); }
  .trend-legend {
    position: absolute; bottom: 70px; left: 16px; z-index: 1100;
    background: rgba(19, 28, 46, 0.96); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; box-shadow: var(--shadow);
    min-width: 280px; font-size: 12.5px;
  }
  .trend-legend h4 {
    margin: 0 0 10px; font-family: var(--font-display);
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--muted);
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .legend-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; color: var(--text-dim); }
  .legend-swatch { width: 20px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; }
  .legend-gradient { width: 100%; height: 14px; border-radius: 4px; margin: 8px 0 4px; }
  .legend-gradient-labels {
    display: flex; justify-content: space-between;
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--muted); margin-bottom: 10px;
  }
  .mode-toggle {
    position: absolute; top: 76px; right: 16px; z-index: 1100;
    background: rgba(19, 28, 46, 0.96); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 6px; display: flex; gap: 4px;
  }
  .mode-toggle button {
    background: transparent; color: var(--text-dim); border: none;
    padding: 8px 14px; border-radius: 8px; font-size: 12.5px;
    font-weight: 500; cursor: pointer; transition: all 0.15s;
    font-family: var(--font-body);
  }
  .mode-toggle button.active { background: var(--accent); color: #08121c; font-weight: 600; }
  .mode-toggle button:not(.active):hover { background: var(--accent-soft); color: var(--accent-hi); }
  @media (max-width: 768px) {
    .stats-panel, .trend-legend {
      position: relative; top: auto; left: auto; bottom: auto;
      margin: 0 8px 8px 8px; min-width: 0;
    }
    .stats-panel { margin-top: 170px; }
    .mode-toggle { top: 74px; right: 8px; }
    .variable-toggle { top: 128px; right: 8px; }
    .trend-title { top: 70px; padding: 8px 16px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🛰️</span>
    <div>
      <h1>Australia Environmental Monitoring</h1>
      <p>Trends · NDVI &amp; LST · 2015–2024</p>
    </div>
  </div>
  <nav class="nav" id="mainNav">
    <a href="../index.html" class="nav-link">🗺️ Map</a>
    <a href="../outputs.html" class="nav-link">🖼️ Outputs</a>
    <a href="../report.html" class="nav-link">📄 Report</a>
    <a href="index.html" class="nav-link active">📈 Trends</a>
  </nav>
  <div class="actions">
    <button id="fitBtn" title="Fit to Australia">🇦🇺 Fit AU</button>
    <button class="menu-toggle" id="menuToggle" title="Menu" aria-label="Open menu">☰</button>
  </div>
</header>

<div class="trend-title">
  <h2 id="trendTitle">NDVI Trend · Australia 2015–2024</h2>
  <p id="trendSubtitle">Per-pixel OLS slope on QA-masked MODIS MOD13A2</p>
</div>

<div class="mode-toggle">
  <button id="modeClassBtn" class="active" data-mode="class">Classified</button>
  <button id="modeSlopeBtn" data-mode="slope">Continuous</button>
</div>

<div class="variable-toggle">
  <button id="varNdviBtn" class="active" data-var="ndvi">🌿 NDVI</button>
  <button id="varLstBtn" data-var="lst">🌡️ LST</button>
</div>

<div id="trend-map"></div>

<aside class="stats-panel" id="statsPanel">
  <h3>Statistics</h3>
  <div id="statsContent"><em>Loading…</em></div>
</aside>

<div class="trend-legend" id="legendBox">
  <h4 id="legendTitle">Legend</h4>
  <div id="legendContent"></div>
</div>

<footer class="footer">
  <span id="timestamp">—</span>
  <span>·</span>
  <span>OLS slope on QA-masked satellite data · 2015–2024</span>
  <span>·</span>
  <a href="https://earthengine.google.com" target="_blank" rel="noopener">Powered by GEE</a>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const AU_BBOX = [[-44.5, 112.0], [-8.0, 154.0]];
const DATA_URLS = {
  ndvi: '../data/trends_tile.json',
  lst:  '../data/lst_trend_tile.json',
};
const TITLES = {
  ndvi: { title: 'NDVI Trend · Australia 2015–2024', subtitle: 'Per-pixel OLS slope on QA-masked MODIS MOD13A2' },
  lst:  { title: 'LST Trend · Australia 2015–2024',  subtitle: 'Per-pixel OLS slope on LST anomalies (MOD11A2)' },
};

const map = L.map('trend-map', {
  center: [-25.5, 134.0], zoom: 4, zoomControl: true, preferCanvas: true,
});
L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution: '© Esri, Maxar', maxZoom: 19 }
).addTo(map);
L.control.scale({ imperial: false, position: 'bottomright' }).addTo(map);

let tileData = {};
let slopeLayer = null;
let classLayer = null;
let allLayers = [];
let currentMode = 'class';
let currentVar = 'ndvi';

Promise.all([
  fetch(DATA_URLS.ndvi).then(r => r.json()),
  fetch(DATA_URLS.lst).then(r => r.json()),
])
  .then(([ndviData, lstData]) => {
    tileData.ndvi = ndviData;
    tileData.lst = lstData;
    buildLayers();
    renderStats();
    renderLegend(currentMode);
    updateTimestamp(tileData[currentVar].generated_at);
  })
  .catch(err => {
    document.getElementById('statsContent').innerHTML =
      '<span style="color:#f87171">Failed to load trends data.<br><small>' + err.message + '</small></span>';
    console.error(err);
  });

function clearMapLayers() {
  allLayers.forEach(layer => {
    if (map.hasLayer(layer)) map.removeLayer(layer);
  });
  allLayers = [];
  slopeLayer = null;
  classLayer = null;
}

function buildLayers() {
  clearMapLayers();
  const d = tileData[currentVar];
  if (!d) return;

  slopeLayer = L.tileLayer(d.tiles.slope, {
    attribution: 'GEE', maxZoom: 18, opacity: 0.9, crossOrigin: true,
  });
  classLayer = L.tileLayer(d.tiles.class, {
    attribution: 'GEE', maxZoom: 18, opacity: 0.9, crossOrigin: true,
  });
  allLayers.push(slopeLayer, classLayer);

  if (currentMode === 'class') classLayer.addTo(map);
  else slopeLayer.addTo(map);
}

document.getElementById('modeClassBtn').addEventListener('click', () => setMode('class'));
document.getElementById('modeSlopeBtn').addEventListener('click', () => setMode('slope'));

function setMode(mode) {
  if (mode === currentMode) return;
  currentMode = mode;
  document.querySelectorAll('.mode-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  if (mode === 'class') {
    if (map.hasLayer(slopeLayer)) map.removeLayer(slopeLayer);
    classLayer.addTo(map);
  } else {
    if (map.hasLayer(classLayer)) map.removeLayer(classLayer);
    slopeLayer.addTo(map);
  }
  renderLegend(mode);
}

document.getElementById('varNdviBtn').addEventListener('click', () => setVar('ndvi'));
document.getElementById('varLstBtn').addEventListener('click', () => setVar('lst'));

function setVar(v) {
  if (v === currentVar) return;
  currentVar = v;

  document.querySelectorAll('.variable-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.var === v);
  });

  const t = TITLES[v];
  document.getElementById('trendTitle').textContent = t.title;
  document.getElementById('trendSubtitle').textContent = t.subtitle;

  buildLayers();
  renderStats();
  renderLegend(currentMode);
  updateTimestamp(tileData[currentVar].generated_at);
}

function renderStats() {
  const d = tileData[currentVar];
  const s = d.statistics;
  const mean = s.slope_mean;
  const unit = d.units || 'unit';
  let direction = currentVar === 'ndvi'
    ? (mean > 0 ? 'Greening' : mean < 0 ? 'Browning' : 'No trend')
    : (mean > 0 ? 'Warming' : mean < 0 ? 'Cooling' : 'No trend');
  const rows = [
    ['Variable', d.variable], ['Period', d.period || '2015–2024'],
    ['Mean slope', (mean >= 0 ? '+' : '') + mean.toFixed(6)], ['Unit', unit],
    ['Min / Max', s.slope_min.toFixed(4) + ' … ' + s.slope_max.toFixed(4)],
    ['Std dev', s.slope_stdDev.toFixed(6)], ['Direction', direction],
  ];
  document.getElementById('statsContent').innerHTML = rows.map(
    row => '<div class="stat-row"><span class="label">' + row[0] + '</span><span class="value">' + row[1] + '</span></div>'
  ).join('');
}

function renderLegend(mode) {
  const d = tileData[currentVar];
  const l = d.legend[mode];
  document.getElementById('legendTitle').textContent = l.title;
  let html = '';
  if (mode === 'slope') {
    const s = l.stops;
    const gradient = 'linear-gradient(90deg, ' + s[0].color + ' 0%, ' + s[1].color + ' 50%, ' + s[2].color + ' 100%)';
    html += '<div class="legend-gradient" style="background:' + gradient + '"></div>';
    html += '<div class="legend-gradient-labels"><span>' + s[0].label + '</span><span>' + s[1].label + '</span><span>' + s[2].label + '</span></div>';
  } else {
    l.stops.forEach(stop => {
      html += '<div class="legend-row"><span class="legend-swatch" style="background:' + stop.color + '"></span><span>' + stop.label + '</span></div>';
    });
  }
  document.getElementById('legendContent').innerHTML = html;
}

function updateTimestamp(iso) {
  if (!iso) return;
  const d = new Date(iso);
  document.getElementById('timestamp').textContent = 'Generated: ' + d.toLocaleString();
}

document.getElementById('fitBtn').addEventListener('click', () => map.fitBounds(AU_BBOX));
const menuToggle = document.getElementById('menuToggle');
const mainNav = document.getElementById('mainNav');
if (menuToggle && mainNav) {
  menuToggle.addEventListener('click', () => mainNav.classList.toggle('mobile-open'));
}
</script>
</body>
</html>
